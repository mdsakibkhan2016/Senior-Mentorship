<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap/dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5 text-center">
    <div class="alert alert-danger p-5">
        <h2>⚠️ Something went wrong</h2>
        <p class="mt-3">
            <strong>Status:</strong>
            <span th:text="${status}">500</span>
        </p>
        <p>
            <strong>Message:</strong>
            <span th:text="${error}">Internal Server Error</span>
        </p>
        <a href="/admindashboard" class="btn btn-primary mt-3">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
