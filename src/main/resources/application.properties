spring.application.name=Senior Mentorship

# ============================================================
# MongoDB Configuration
# Option 1 (Easy - Direct): URI directly likhle env var lagbe na
# Option 2 (Env var): ${MONGODB_URI} use korle Run Config e set korte hobe
# ============================================================
spring.data.mongodb.uri=${MONGODB_URI}

# ============================================================
# Google Gemini API Key
# Option 1 (Easy - Direct): Key directly likhle env var lagbe na
# Option 2 (Env var): ${GEMINI_API_KEY} use korle Run Config e set korte hobe
# ============================================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL}

# ============================================================
# Disable whitelabel error page
# ============================================================
server.error.whitelabel.enabled=false
